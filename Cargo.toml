[package]
name = "itasca"
version = "0.1.1"
edition = "2021"
description = "Formally verified WebAssembly validator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eqrion/itasca"
include = [
    "src/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["std"]
std = []

[target.'cfg(not(charon))'.dependencies]
libm = { version = "=0.2.16", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(charon)', 'cfg(charon_exec)'] }

[dev-dependencies]
wasmparser = "=0.252.0"
wast = "=252.0.0"
anyhow = "1"
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "simd", "stable"] }
wasm-smith = "=0.252.0"
arbitrary = "1"
