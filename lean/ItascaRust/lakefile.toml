name = "ItascaRust"
defaultTargets = ["ItascaRust"]

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
# Keep this revision in sync with lean/justfile.
rev = "557eff83ecef5083b98a52a94ca7fae63d6c1dab"
subDir = "backends/lean"

[[lean_lib]]
name = "ItascaRust"
# Only the named modules belong to the library. Aeneas also emits an ignored template.
roots = []
globs = ["ItascaRust.Types", "ItascaRust.FunsExternal", "ItascaRust.Funs"]
