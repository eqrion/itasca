name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test
      - run: cargo test --no-default-features

  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init vendor/spectec
      # Cache dependencies only. Every run builds this project's proofs afresh.
      - uses: actions/cache@v6
        with:
          path: lean/Itasca/.lake/packages
          key: lake-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/Itasca/lake-manifest.json', 'lean/ItascaRust/lake-manifest.json', 'lean/WebAssembly/lake-manifest.json', 'lean/lean-toolchain') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/Itasca
          auto-config: false
          build: false
          use-github-cache: false
          use-mathlib-cache: true
      - uses: extractions/setup-just@v4
      - name: Build proofs, check for sorry, and report axioms
        working-directory: lean
        run: just audit
